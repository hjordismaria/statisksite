<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="test.css" />
    <title>Product</title>
  </head>

  <body>
    <header class="top">
      <h1>FashionRUs</h1>
      <nav class="menu">
        <a href="#">Categories</a>
        <a href="#">Brands</a>
        <a href="#">Seasons</a>
      </nav>
    </header>

    <main>
      <article class="product">
        <!-- Left: image -->
        <div class="img">
          <img src="https://kea-alt-del.dk/t7/images/webp/640/1575.webp" alt="Jersey" />
        </div>

        <!-- Middle: info -->
        <div class="info">
          <h2>Product Information</h2>

          <h3>Model name</h3>
          <p>Sahara Team India Fanwear Round Neck Jersey</p>

          <h3>Color</h3>
          <p>Blue</p>

          <h3>Inventory number</h3>
          <p>1163</p>

          <h2 class="brand">Nike</h2>
          <p>Nike, creating experiences for today’s athlete</p>
        </div>

        <!-- Right: buy box -->
        <div class="buy">
          <h3>Sahara Team India Fanwear Round Neck Jersey</h3>
          <p class="meta">Nike | Tshirts</p>

          <p class="label">Choose a size</p>
          <select>
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
          </select>

          <a class="btn" href="#">Add to basket</a>
        </div>
      </article>
    </main>
  </body>
</html>
