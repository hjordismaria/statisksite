<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/product.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="split">
      <h1>FashionRUs</h1>
      <div class="smallpush">
        <a href="/">Categories</a>
        <a href="/">Brands</a>
        <a href="/">Seasons</a>
      </div>
    </div>

    <main>
      <article class="product-profile">
        <div class="product-img">
          <img src="https://kea-alt-del.dk/t7/images/webp/640/1599.webp" alt="" />
        </div>
        <div class="product-info">
          <h1>Product Information</h1>
          <h3>Model Name</h3>
          <p>Product Description</p>
          <h3>Color</h3>
          <p>Red</p>
          <h3>Inventory Number</h3>
          <p>1234</p>
          <div>
            <h2>Puma</h2>
            <p>Brand Description</p>
          </div>
        </div>
        <div class="product-purchase">
          <h2>Blablabla</h2>
          <p>Puma | Accesories</p>
          <div>
            <p>choose a size</p>
            <a href="/">Add to basket</a>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
