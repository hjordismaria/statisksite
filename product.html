    <header class="headernav">
      <a href="#">
        <h1>Fashion<span>R </span>Us</h1>

      <nav class="smallpush">
        <a href="/">Categories</a>
        <a href="/">Brands</a>
        <a href="/">Seasons</a>

    <main id="productContainer">
      <figure>
        <img src="https://kea-alt-del.dk/t7/images/webp/640/1599.webp" alt="Product Image" class="productImage" />
        <span class="saleLabel">Udsalg!</span>
      </figure>

      <section class="productDetails">
        <div class="productInfo">
          <h2 class="productnameInfo">Product Information</h2>

          <p class="productModelName"><span class="bold">Model name</span>Product Name</p>

          <p class="productColor"><span class="bold">Color</span>Green</p>

          <p class="productNumber"><span class="bold">Inventory number</span>1163</p>
        </div>

        <!-- NEW: right side column -->
        <div class="purchaseArea">
          <h2 class="productName">Product Name</h2>

          <div class="productMeta">
            <p class="articleType"><span class="bold">Type</span>Caps</p>
            <p class="productCategory"><span class="bold">Category</span>Accessories</p>
            <p class="productPrice"><span class="bold">Price</span>350,-</p>

            <p>Choose a size</p>
            <select>
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </div>

          <button class="buyButton">Buy Now</button>
        </div>
      </section>
